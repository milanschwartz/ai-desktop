services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ai-desktop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_desktop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # API Backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-desktop-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_desktop
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET is required - generate with: openssl rand -base64 48}'
      COOKIE_SECRET: '${COOKIE_SECRET:?COOKIE_SECRET is required - generate with: openssl rand -base64 32}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?ENCRYPTION_KEY is required - generate with: openssl rand -base64 32}'
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
      PORT: 8080
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-desktop-web
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
